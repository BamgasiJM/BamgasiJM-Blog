<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light dark">
  <title>BamgasiJM BLOG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;family=Nanum+Gothic+Coding&amp;family=Noto+Sans:wght@100..900&amp;family=Noto+Sans+KR:wght@100..900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" type="module"></script>
</head>
<body class="dark">
  <a class="skip-link" href="#article">본문으로 이동</a>
  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="글 탐색기">
      <div class="sidebar-header"><a class="brand" href="#" aria-label="BamgasiJM BLOG 홈"><span>BamgasiJM</span><span class="brand-suffix">BLOG</span></a><button class="icon-button mobile-close" id="close-sidebar" aria-label="탐색기 닫기">×</button></div>
      <div class="explorer-label"><button id="introduction-link" class="introduction-link selected" aria-current="page">Introduction</button><button class="icon-button" id="new-note" aria-label="새 초안 만들기" title="새 초안 만들기" hidden>+</button></div>
      <section class="blog-section" aria-labelledby="blog-section-title">
      <h2 class="sidebar-section-title" id="blog-section-title">Generative Art 블로그</h2>
      <div class="tree-search-wrap"><input id="tree-search" type="search" placeholder="Search folders and posts" aria-label="Search folders and posts" autocomplete="off"></div>
      <div class="tree-actions"><button id="toggle-folders" class="icon-button" aria-controls="tree" aria-label="Expand all folders" title="Expand all folders" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path id="folder-toggle-path" d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button></div>
      <div class="library-feedback"><span id="library-status" role="status"></span><button id="retry-library" hidden>다시 시도</button></div>
      <nav id="tree" class="tree" aria-label="Generative Art 폴더와 글"></nav>
      </section>
      <section class="class-section" aria-labelledby="class-section-title"><h2 class="sidebar-section-title" id="class-section-title">Class 수업자료</h2><nav id="class-tree" class="class-tree" aria-label="수업과 주차별 자료"></nav></section>
    </aside>
    <div id="sidebar-resizer" class="panel-resizer" role="separator" aria-label="글 목록 너비 조절" aria-controls="sidebar" aria-orientation="vertical" aria-valuemin="220" aria-valuemax="560" aria-valuenow="288" tabindex="0"></div>
    <div class="scrim" id="scrim" hidden></div>
    <main class="main">
      <header class="topbar"><button class="icon-button" id="sidebar-toggle" aria-label="탐색기 열기" aria-expanded="false">☰</button><div class="topbar-actions"><button id="outline-toggle" class="icon-button" aria-pressed="true" aria-controls="outline-panel" aria-expanded="true" aria-label="Hide table of contents" title="Hide table of contents"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M18 8h1M18 12h1M18 16h1"/></svg></button><button id="code-toggle" class="icon-button" aria-pressed="true" aria-label="Code colors on" title="Code colors on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 6-6 6 6 6M16 6l6 6-6 6M14 3l-4 18"/></svg><span id="code-label" class="sr-only">Code colors on</span></button><button id="theme-toggle" class="icon-button" aria-pressed="true" aria-label="Light mode" title="Light mode"><span class="theme-icon theme-moon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z"/></svg></span><span class="theme-icon theme-sun"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg></span><span id="theme-label" class="sr-only">Light mode</span></button><button class="icon-button" id="mode-toggle" aria-label="Switch to edit mode" title="Switch to edit mode" aria-pressed="false"><span class="mode-pen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg></span><span class="mode-book"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v15M12 6C9 3 5 3 2 4v15c4-1 7 0 10 2 3-2 6-3 10-2V4c-3-1-7-1-10 2Z"/></svg></span></button></div></header>
      <section class="reading-layout" id="reading-layout">
        <div class="article-scroll" id="article-scroll"><article id="article" class="article" tabindex="-1"></article></div>
        <div id="outline-resizer" class="panel-resizer" role="separator" aria-label="목차 너비 조절" aria-controls="outline-panel" aria-orientation="vertical" aria-valuemin="160" aria-valuemax="420" aria-valuenow="216" tabindex="0"></div>
        <aside class="outline" id="outline-panel" aria-label="이 글의 목차"><h2 class="outline-title">목차</h2><nav id="outline"></nav></aside>
      </section>
      <section class="editor-layout" id="editor-layout" hidden aria-label="글 편집">
        <div class="editor-actions"><div class="editor-tabs" role="group" aria-label="모바일 편집 보기"><button id="tab-edit" aria-pressed="true">에디터</button><button id="tab-preview" aria-pressed="false">프리뷰</button></div><div class="format-toolbar" aria-label="본문 도구"><button data-insert="heading" title="제목 삽입">H₂</button><button data-insert="bold" title="굵은 글씨 삽입"><b>B</b></button><button data-insert="code" title="코드 삽입">&lt;/&gt;</button><button data-insert="math" title="수식 삽입">∑</button><button id="open-media">▧ <span>Drive 미디어</span></button></div><label class="sync-label"><input id="sync-toggle" type="checkbox" checked> 스크롤 동기화</label></div>
        <div class="editor-panes" id="editor-panes"><div class="source-pane"><div class="pane-label">Markdown</div><div class="source-wrap"><textarea id="source" aria-label="Markdown 원문" spellcheck="false"></textarea><div class="source-mirror" id="source-mirror" aria-hidden="true"></div></div></div><div class="pane-resizer" id="pane-resizer" role="separator" aria-label="에디터 너비 조절" aria-orientation="vertical" aria-valuemin="30" aria-valuemax="70" aria-valuenow="50" tabindex="0"></div><div class="preview-pane"><div class="pane-label">프리뷰</div><div id="editor-preview" class="editor-preview prose"></div></div></div>
        <footer class="editor-footer"><span id="save-status" role="status"></span><div><button class="button" id="save-draft">초안 저장</button><button class="button button-primary" id="publish">발행</button></div></footer>
      </section>
    </main>
  </div>
  <dialog id="media-dialog" aria-labelledby="media-title"><div class="dialog-header"><h2 id="media-title">Drive 미디어</h2><button class="icon-button" id="close-media" aria-label="닫기">×</button></div><div id="media-grid" class="media-grid"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
